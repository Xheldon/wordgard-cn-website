name: Push Smoke Test

# Note: 临时冒烟测试，用于验证 GIT_TOKEN 能否推送 main（避免白跑几小时翻译后才发现推送失败）。
# 对比 persist-credentials true/false 两种情况，用 set +e 让两次推送都执行并打印退出码。
# 验证完可删除本文件。
on:
  workflow_dispatch:

jobs:
  persist-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          persist-credentials: true
      - name: 推送测试（persist-credentials: true，复现失败）
        run: |
          git config --global user.name 'Xheldon[bot]'
          git config --global user.email 'c1006044256@gmail.com'
          git checkout -b __smoke_true__
          git commit --allow-empty -m "smoke test true [skip ci]"
          set +e
          git push -f https://Xheldon:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }} __smoke_true__:__smoke_true__
          echo "=== PERSIST_TRUE_PUSH_EXIT=$? ==="
          git push https://Xheldon:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }} :__smoke_true__ >/dev/null 2>&1
          echo "cleanup done"

  persist-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          persist-credentials: false
      - name: 推送测试（persist-credentials: false，预期修复）
        run: |
          git config --global user.name 'Xheldon[bot]'
          git config --global user.email 'c1006044256@gmail.com'
          git checkout -b __smoke_false__
          git commit --allow-empty -m "smoke test false [skip ci]"
          set +e
          git push -f https://Xheldon:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }} __smoke_false__:__smoke_false__
          echo "=== PERSIST_FALSE_PUSH_EXIT=$? ==="
          git push https://Xheldon:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }} :__smoke_false__ >/dev/null 2>&1
          echo "cleanup done"
