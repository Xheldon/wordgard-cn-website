name: Wordgard 中文翻译

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # 每周日的午夜

# Note: 同一时间只允许一个翻译任务运行，避免手动触发与定时任务重叠时
# 两个 job 同时向 main 强推打架。cancel-in-progress: false 表示排队而非取消。
concurrency:
  group: wordgard-translate
  cancel-in-progress: false

jobs:
  Build_and_Publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v3
        with:
          ref: main
          persist-credentials: true

      - name: 设置 Node 环境
        uses: actions/setup-node@v4
        with:
          # wordgard 与其 website 构建脚本要求 Node >= 22（直接运行 .ts）
          node-version: '22'

      - name: 设置 Git
        run: |
          git config --global user.name 'Xheldon[bot]'
          git config --global user.email 'c1006044256@gmail.com'

      - name: 检出上游 wordgard 与 website 仓库
        run: |
          # wordgard 的 website 构建要求 website 检出在 wordgard 库内部（wordgard/website），
          # 参考手册由 wordgard 库源码经 builddocs 生成。二者均支持匿名浅克隆。
          git clone --depth 1 https://code.haverbeke.berlin/wordgard/wordgard.git wordgard
          git clone --depth 1 https://code.haverbeke.berlin/wordgard/website.git wordgard/website

      - name: 检查是否有更新
        id: check_commits
        run: |
          # Note: 参考手册来自库源码，网站结构来自 website，任一仓库更新都需要重建，
          # 因此用两个仓库 HEAD 的组合作为版本标识。
          LIB_COMMIT=$(git -C wordgard rev-parse HEAD)
          SITE_COMMIT=$(git -C wordgard/website rev-parse HEAD)
          NEW_COMMIT="${LIB_COMMIT}-${SITE_COMMIT}"
          if [ -f last-commit.txt ]; then
            OLD_COMMIT=$(cat last-commit.txt)
          else
            OLD_COMMIT=""
          fi
          echo "new_commit=$NEW_COMMIT" >> $GITHUB_ENV
          echo "old_commit=$OLD_COMMIT" >> $GITHUB_ENV
          if [[ "$NEW_COMMIT" != "$OLD_COMMIT" ]]; then
            echo "发现上游有更新"
            echo "new_commits=true" >> $GITHUB_ENV
            # Note: last-commit.txt 改在"推送"步骤中仅当翻译无错误时才写入，出错则下次自动重试。
          else
            if [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
              echo "手动触发更新"
              echo "new_commits=true" >> $GITHUB_ENV
            else
              echo "没有新的提交。"
              echo "new_commits=false" >> $GITHUB_ENV
            fi
          fi

      - name: 构建 wordgard 站点
        if: env.new_commits == 'true'
        run: |
          # 先构建库（npm install 触发 prepare -> 产出 dist/），再构建网站到 output/
          cd wordgard
          npm install
          cd website
          npm install
          node src/build.ts

      - name: 构建中文翻译
        if: env.new_commits == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_URL: ${{ secrets.OPENAI_URL }}
        run: |
          # 根目录翻译脚本依赖用 npm ci（有 lock 文件，可复现）
          npm ci
          # 清空上一次可能遗留在仓库里的错误记录，确保 error.txt 只反映本次运行
          rm -f error.txt
          node index.js

      - name: 推送到 main 分支
        if: env.new_commits == 'true'
        run: |
          git checkout -b temp
          rm -rf public
          mkdir -p public && cp -R wordgard/website/output/* public
          # Note: 上游 robots.txt 可能屏蔽 AI 爬虫，这里删除它，不让中文翻译站跟着屏蔽
          # （Googlebot 未被屏蔽，不影响普通搜索收录）。
          rm -f public/robots.txt
          # Note: 仅当本次翻译无错误时才推进 last-commit.txt，出错则保持旧值以便下次重试
          if [ ! -s error.txt ]; then
            echo "$new_commit" > last-commit.txt
          fi
          git add .
          if [ -s "error.txt" ]; then
            git commit -m "本次翻译存在错误[bot]"
          else
            git commit -m "更新文档[bot]"
          fi
          git push -f https://Xheldon:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }} temp:main

      - name: 检查是否存在错误
        if: env.new_commits == 'true'
        run: |
          if [ -s "error.txt" ]; then
            echo "本次翻译存在错误，已保留原文并未推进 last-commit.txt，下次运行会自动重试"
            exit 1
          fi
